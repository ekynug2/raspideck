<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta http-equiv="X-UA-Compatible" content="ie=edge"/>
  <title>Sign In &bull; RaspiDeck Signage</title>
  <!-- CSS files -->
  <link href="/static/vendor/tabler/css/tabler.min.css" rel="stylesheet"/>
  <link href="/static/vendor/tabler/css/tabler-icons.min.css" rel="stylesheet"/>
  <!-- Google Fonts for Tabler Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --tblr-font-sans-serif: 'Inter', -apple-system, BlinkMacSystemFont, San Francisco, Segoe UI, Roboto, Helvetica Neue, sans-serif;
    }
    body {
      font-feature-settings: "cv03", "cv04", "cv11";
    }
    .auth-brand-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
      color: #ffffff;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(2, 132, 199, 0.35);
    }
  </style>
</head>
<body class="d-flex flex-column">
  <script>
    // Tabler theme initialization
    const theme = localStorage.getItem("tablerTheme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.body.setAttribute("data-bs-theme", theme);
  </script>

  <div class="page page-center">
    <div class="container container-tight py-4">
      <div class="text-center mb-4">
        <div class="d-inline-block mb-3">
          <div class="auth-brand-icon">
            <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-device-tv" width="28" height="28" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
              <path d="M3 7m0 2a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v9a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2z"/>
              <path d="M16 3l-4 4l-4 -4"/>
            </svg>
          </div>
        </div>
        <h1 class="h2 fw-bold text-body mb-1">RaspiDeck</h1>
        <p class="text-secondary small mb-0">Digital Signage Controller Hub</p>
      </div>

      <div class="card card-md shadow-sm border-0">
        <div class="card-body p-4 p-md-5">
          <h2 class="card-title text-center mb-4 fw-semibold">Sign in to your account</h2>

          {% if error %}
          <div class="alert alert-danger alert-dismissible" role="alert">
            <div class="d-flex">
              <div>
                <svg xmlns="http://www.w3.org/2000/svg" class="icon alert-icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
                  <circle cx="12" cy="12" r="9"></circle>
                  <line x1="12" y1="8" x2="12" y2="12"></line>
                  <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
              </div>
              <div class="text-truncate">{{ error }}</div>
            </div>
          </div>
          {% endif %}

          <form action="/login" method="post" autocomplete="off">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="mb-4">
              <label class="form-label d-flex justify-content-between">
                <span>Admin Password</span>
              </label>
              <div class="input-group input-group-flat">
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter administrator password" required autofocus>
                <span class="input-group-text">
                  <a href="#" class="link-secondary" title="Show password" onclick="togglePassword(event)" data-bs-toggle="tooltip">
                    <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                      <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                      <circle cx="12" cy="12" r="2"/>
                      <path d="M22 12c-2.667 4.667 -6 7 -10 7s-7.333 -2.333 -10 -7c2.667 -4.667 6 -7 10 -7s7.333 2.333 10 7"/>
                    </svg>
                  </a>
                </span>
              </div>
            </div>

            <div class="form-footer">
              <button type="submit" class="btn btn-primary w-100 py-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon me-2" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                  <path d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2"/>
                  <path d="M20 12h-13l3 -3m0 6l-3 -3"/>
                </svg>
                Sign In to Dashboard
              </button>
            </div>
          </form>
        </div>
      </div>

      <div class="text-center text-secondary mt-3 small">
        Raspberry Pi Digital Signage Node &bull; v2.0
      </div>
    </div>
  </div>

  <script src="/static/vendor/tabler/js/bootstrap.bundle.min.js"></script>
  <script src="/static/vendor/tabler/js/tabler.min.js"></script>
  <script>
    function togglePassword(e) {
      e.preventDefault();
      const input = document.getElementById("password");
      const icon = document.getElementById("eye-icon");
      if (input.type === "password") {
        input.type = "text";
        icon.innerHTML = '<path stroke="none" d="M0 0h24v24H0z" fill="none"/><line x1="3" y1="3" x2="21" y2="21" /><path d="M10.584 10.587a2 2 0 0 0 2.828 2.83" /><path d="M9.363 5.365a9.466 9.466 0 0 1 2.637 -.365c4 0 7.333 2.333 10 7c-.778 1.361 -1.612 2.524 -2.503 3.488m-2.14 1.861c-1.631 1.1 -3.415 1.651 -5.357 1.651c-4 0 -7.333 -2.333 -10 -7c1.369 -2.395 2.913 -4.175 4.632 -5.341" />';
      } else {
        input.type = "password";
        icon.innerHTML = '<path stroke="none" d="M0 0h24v24H0z" fill="none"/><circle cx="12" cy="12" r="2"/><path d="M22 12c-2.667 4.667 -6 7 -10 7s-7.333 -2.333 -10 -7c2.667 -4.667 6 -7 10 -7s7.333 2.333 10 7"/>';
      }
    }
  </script>
</body>
</html>
