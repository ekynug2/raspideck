<!-- TAB 2: PLAYLISTS -->
<div id="view-playlists" class="tab-view-panel d-none">
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
    <div>
      <h2 class="h3 fw-bold mb-1">Playlists & Loops</h2>
      <div class="text-secondary small">Create seamless looping schedules for images and videos with custom durations.</div>
    </div>
    <div class="d-flex align-items-center gap-2">
      <div class="input-icon">
        <span class="input-icon-addon">
          <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="18" height="18" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none">
            <circle cx="10" cy="10" r="7" />
            <line x1="21" y1="21" x2="15" y2="15" />
          </svg>
        </span>
        <input type="text" id="playlists-search" class="form-control" placeholder="Search playlists..." oninput="renderPlaylists()">
      </div>
      <button class="btn btn-purple text-white" onclick="openCreatePlaylistModal()">
        <svg xmlns="http://www.w3.org/2000/svg" class="icon me-1" width="20" height="20" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
        Create Playlist
      </button>
    </div>
  </div>

  <!-- Playlists Grid -->
  <div class="row row-deck row-cards" id="playlists-grid">
    <!-- Dynamically rendered by playlists.js -->
  </div>
</div>
