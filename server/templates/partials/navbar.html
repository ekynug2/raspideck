<!-- TOP NAVBAR -->
<header class="navbar navbar-expand-md d-print-none sticky-top border-bottom">
  <div class="container-xl">
    <!-- BRAND -->
    <a href="/" class="navbar-brand navbar-brand-autodark d-flex align-items-center gap-2 me-4 text-decoration-none">
      <div class="brand-icon-box">
        <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="22" height="22" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
          <path d="M3 7m0 2a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v9a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2z"/>
          <path d="M16 3l-4 4l-4 -4"/>
        </svg>
      </div>
      <div>
        <div class="fw-bold fs-3 lh-1">RaspiDeck</div>
        <div class="text-secondary fs-6 fw-normal">Digital Signage Controller</div>
      </div>
    </a>

    <!-- NAV TABS -->
    <ul class="navbar-nav flex-row flex-grow-1 align-items-center gap-1" id="main-nav-tabs">
      <li class="nav-item">
        <a class="nav-link active fw-medium px-3 py-2 rounded-2" href="#screens" onclick="switchTab('screens', event)">
          <svg xmlns="http://www.w3.org/2000/svg" class="icon me-1 text-primary" width="20" height="20" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none">
            <rect x="2" y="3" width="20" height="14" rx="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
          <span>Displays</span>
          <span class="badge bg-primary-lt ms-2" id="nav-badge-screens">0</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link fw-medium px-3 py-2 rounded-2" href="#playlists" onclick="switchTab('playlists', event)">
          <svg xmlns="http://www.w3.org/2000/svg" class="icon me-1 text-purple" width="20" height="20" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none">
            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
            <circle cx="14" cy="17" r="3" />
            <path d="M17 17v-10h4" />
            <path d="M13 5h-10" />
            <path d="M9 9h-6" />
            <path d="M7 13h-4" />
          </svg>
          <span>Playlists</span>
          <span class="badge bg-purple-lt ms-2" id="nav-badge-playlists">0</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link fw-medium px-3 py-2 rounded-2" href="#media" onclick="switchTab('media', event)">
          <svg xmlns="http://www.w3.org/2000/svg" class="icon me-1 text-azure" width="20" height="20" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none">
            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
            <path d="M15 8h.01" />
            <rect x="4" y="4" width="16" height="16" rx="3" />
            <path d="M4 15l4 -4a3 5 0 0 1 3 0l5 5" />
            <path d="M14 14l1 -1a3 5 0 0 1 3 0l2 2" />
          </svg>
          <span>Media Library</span>
          <span class="badge bg-azure-lt ms-2" id="nav-badge-media">0</span>
        </a>
      </li>
    </ul>

    <!-- RIGHT ACTIONS -->
    <div class="navbar-nav flex-row order-md-last align-items-center gap-2">
      <!-- Refresh Sync Button -->
      <button class="btn btn-icon btn-ghost-secondary rounded-circle" title="Refresh data" onclick="handleManualSync(this)">
        <svg id="sync-icon" xmlns="http://www.w3.org/2000/svg" class="icon" width="20" height="20" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none">
          <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
          <path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4" />
          <path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4" />
        </svg>
      </button>

      <!-- Dark / Light Mode Toggle -->
      <button class="btn btn-icon btn-ghost-secondary rounded-circle" id="theme-toggle-btn" title="Toggle color theme" onclick="toggleTheme()">
        <svg id="theme-icon-dark" xmlns="http://www.w3.org/2000/svg" class="icon" width="20" height="20" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none">
          <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
          <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z" />
        </svg>
        <svg id="theme-icon-light" xmlns="http://www.w3.org/2000/svg" class="icon d-none" width="20" height="20" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none">
          <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
          <circle cx="12" cy="12" r="4" />
          <path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7" />
        </svg>
      </button>

      <!-- User menu (three-dot dropdown, same mechanism as screen cards) -->
      <div class="dropdown" style="position:relative;">
        <button class="btn btn-icon btn-ghost-secondary rounded-circle" onclick="toggleScreenDropdown(event)" aria-label="User menu">
          <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="20" height="20" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none">
            <circle cx="12" cy="5" r="1" />
            <circle cx="12" cy="12" r="1" />
            <circle cx="12" cy="19" r="1" />
          </svg>
        </button>
        <div class="dropdown-menu dropdown-menu-end shadow-sm">
          <span class="dropdown-header">Admin</span>
          <a href="#" class="dropdown-item" onclick="openSplashPreviewModal(event)">
            <svg xmlns="http://www.w3.org/2000/svg" class="icon dropdown-item-icon text-secondary" width="20" height="20" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none">
              <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
              <rect x="4" y="4" width="16" height="16" rx="2" />
              <line x1="8" y1="4" x2="8" y2="20" />
            </svg>
            Preview Boot Splash
          </a>
          <div class="dropdown-divider"></div>
          <a href="/logout" class="dropdown-item text-danger">
            <svg xmlns="http://www.w3.org/2000/svg" class="icon dropdown-item-icon text-danger" width="20" height="20" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none">
              <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
              <path d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2" />
              <path d="M7 12h14l-3 -3m0 6l3 -3" />
            </svg>
            Sign Out
          </a>
        </div>
      </div>
    </div>
  </div>
</header>
