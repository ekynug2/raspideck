<!-- TABLER MODAL CONTAINER -->
<div class="modal modal-blur fade" id="mainModal" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document" id="mainModalDialog">
    <div class="modal-content" id="mainModalContent">
      <!-- Injected via JavaScript (openModal) -->
    </div>
  </div>
</div>

<!-- FLOATING TOAST NOTIFICATIONS -->
<div id="toast-container"></div>

<!-- Upload Progress Panel (Google Drive style) -->
<div id="upload-progress-panel">
  <div class="upload-panel-header" onclick="toggleUploadPanel()">
    <span id="upload-panel-title">Uploading...</span>
    <div class="upload-panel-actions">
      <button type="button" onclick="event.stopPropagation(); toggleUploadPanel()" title="Minimize" id="upload-panel-toggle-btn">&#x2212;</button>
      <button type="button" onclick="event.stopPropagation(); closeUploadPanel()" title="Close">&times;</button>
    </div>
  </div>
  <div class="upload-panel-body" id="upload-panel-body"></div>
</div>
