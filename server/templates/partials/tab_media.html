<!-- TAB 3: MEDIA LIBRARY -->
<div id="view-media" class="tab-view-panel d-none">
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
    <div>
      <h2 class="h3 fw-bold mb-1">Media Assets</h2>
      <div class="text-secondary small">Upload videos (MP4, MKV) and graphics (PNG, JPG, WebP) for display playback.</div>
    </div>
  </div>

  <!-- Upload Dropzone -->
  <div class="card mb-4 border-0 shadow-sm">
    <div class="card-body p-3">
      <div class="upload-dropzone" id="upload-zone" onclick="document.getElementById('file-input').click()">
        <input type="file" id="file-input" multiple accept="image/*,video/*" class="d-none" onchange="handleFileSelect(event)">
        <div class="mb-2 text-primary">
          <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="42" height="42" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" fill="none">
            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
            <path d="M7 18a4.6 4.4 0 0 1 0 -9a5 4.5 0 0 1 11 2h1a3.5 3.5 0 0 1 0 7h-1" />
            <polyline points="9 15 12 12 15 15" />
            <line x1="12" y1="12" x2="12" y2="21" />
          </svg>
        </div>
        <h3 class="fw-bold mb-1">Drop signage files here, or click to browse</h3>
        <div class="text-secondary small">Supports MP4, MKV, WebM, PNG, JPG, WebP (up to 500 MB per file)</div>
      </div>
    </div>
  </div>

  <!-- Media Filters & Search -->
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
    <div class="btn-group">
      <button type="button" class="btn btn-sm btn-outline-secondary active" id="filter-media-all" onclick="setMediaFilter('all')">All Assets</button>
      <button type="button" class="btn btn-sm btn-outline-secondary" id="filter-media-video" onclick="setMediaFilter('video')">Videos Only</button>
      <button type="button" class="btn btn-sm btn-outline-secondary" id="filter-media-image" onclick="setMediaFilter('image')">Images Only</button>
    </div>
    <div class="input-icon">
      <span class="input-icon-addon">
        <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="18" height="18" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none">
          <circle cx="10" cy="10" r="7" />
          <line x1="21" y1="21" x2="15" y2="15" />
        </svg>
      </span>
      <input type="text" id="media-search" class="form-control form-control-sm" placeholder="Search media..." oninput="renderMedia()">
    </div>
  </div>

  <!-- Media Grid -->
  <div class="row row-deck row-cards" id="media-grid">
    <!-- Dynamically rendered by media.js -->
  </div>
</div>
